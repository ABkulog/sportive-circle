{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Log in</h1>
  {% if next_url %}<p class="muted">Log in or sign up to see that page.</p>{% endif %}
  <form method="post" class="form">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="field"><span>UW email</span>
      <input name="email" type="email" value="{{ email }}" placeholder="netid@uw.edu" autocomplete="email" required{% if not email %} autofocus{% endif %}></label>
    <label class="field"><span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required{% if email %} autofocus{% endif %}></label>
    <div class="login-extras">
      <label class="check"><input type="checkbox" name="remember" value="1" checked> Remember me</label>
      <a class="field-link" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>
    <button class="btn btn-block">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('auth.signup', next=next_url or None) }}">Sign up</a></p>
</div>
{% endblock %}
