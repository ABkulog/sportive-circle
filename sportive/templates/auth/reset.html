{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Set a new password</h1>
  <p class="muted">If <strong>{{ email }}</strong> has an account, we emailed it a 6-digit code. It expires in 15 minutes.</p>
  <form method="post" class="form" autocomplete="off">
    {{ csrf_field() }}
    <label class="field"><span>Code from the email</span>
      <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" class="code-input" required autofocus></label>
    <label class="field"><span>New password <em>(at least 8 characters)</em></span>
      <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label class="field"><span>New password (again)</span>
      <input name="password2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-block">Save new password</button>
  </form>
  <p class="muted center">No email? Check spam, or <a href="{{ url_for('auth.forgot_password') }}">send a new code</a>.</p>
</div>
{% endblock %}
