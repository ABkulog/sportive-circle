{#- One design for every email the app sends. Email apps ignore <style> blocks and block images, so
    everything is inline and there are no pictures (branding is text in UW purple and gold). Light colors on purpose:
    dark-mode mail apps adjust them automatically. -#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f2f8;">
{% if preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>{% endif %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2f8;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f1b2b;">
      <tr><td style="background:#4b2e83;padding:18px 24px;">
        <span style="font-size:20px;font-weight:800;color:#ffffff;letter-spacing:-0.2px;">Sportive <span style="color:#b7a57a;">Circle</span></span>
      </td></tr>
      <tr><td style="height:4px;line-height:4px;font-size:0;background:#b7a57a;">&nbsp;</td></tr>
      <tr><td style="padding:28px 24px 8px;">
        <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#32006e;">{{ heading }}</h1>
        {% for line in lines %}<p style="margin:0 0 14px;font-size:15px;line-height:1.55;color:#333333;">{{ line }}</p>{% endfor %}
        {% if code %}
          <div style="margin:6px 0 18px;padding:18px 12px;border-radius:12px;background:#f1edf8;text-align:center;">
            <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#6e6a78;margin-bottom:6px;">Your code</div>
            <div style="font-size:34px;font-weight:800;letter-spacing:8px;color:#4b2e83;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ code }}</div>
          </div>
        {% endif %}
        {% for line in after %}<p style="margin:0 0 14px;font-size:15px;line-height:1.55;color:#333333;">{{ line }}</p>{% endfor %}
        {% if button %}
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 20px;"><tr><td style="border-radius:10px;background:#4b2e83;">
            <a href="{{ button[1] }}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">{{ button[0] }}</a>
          </td></tr></table>
        {% endif %}
        <p style="margin:6px 0 22px;font-size:15px;color:#333333;">Go Dawgs! 💜💛<br><span style="color:#6e6a78;">The Sportive Circle team</span></p>
      </td></tr>
      <tr><td style="padding:16px 24px 22px;border-top:1px solid #ece9f2;font-size:12px;line-height:1.5;color:#7a7585;">
        {% if reason %}{{ reason }}<br>{% endif %}
        {% if unsubscribe %}<a href="{{ unsubscribe }}" style="color:#4b2e83;">Unsubscribe from these emails</a> · {% endif %}<a href="{{ site }}/settings" style="color:#4b2e83;">Change what we email you</a><br>
        Sportive Circle is a student project for UW Huskies, not an official University of Washington service.
        <a href="{{ site }}" style="color:#4b2e83;">{{ site_name }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
