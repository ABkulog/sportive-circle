{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('settings.home') }}">← Settings</a>
<div class="card form-card">
  <h1>Change password</h1>
  <form method="post" action="{{ url_for('profile.change_password') }}" class="form">
    {{ csrf_field() }}
    <label class="field"><span>Current password</span>
      <input name="current_password" type="password" autocomplete="current-password" required></label>
    <label class="field"><span>New password <em>(at least 8 characters)</em></span>
      <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label class="field"><span>New password (again)</span>
      <input name="password2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-block">Change password</button>
  </form>
</div>
{% endblock %}
