# Render Blueprint: Render reads this file from GitHub and sets everything up.
# Render dashboard -> New -> Blueprint -> pick this repository -> fill in the email settings -> Apply.
services:
  # The website.
  - type: web
    name: sportive-circle
    runtime: python
    plan: starter            # a paid plan is needed for the disk that keeps the database
    region: oregon           # closest to Seattle
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /how-it-works
    disk:
      name: data
      mountPath: /data       # the database lives here and survives every redeploy
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true  # Render makes a long random one
      - key: TASK_TOKEN
        generateValue: true
      - key: BEHIND_PROXY
        value: "1"
      - key: DATABASE
        value: /data/sportive_circle.db
      - key: ADMIN_EMAILS
        value: akulog@uw.edu
      - key: CONTACT_EMAIL     # shown on the Privacy and Terms pages (use the app's own email, not a personal one)
        sync: false
      - key: MAIL_SERVER
        sync: false          # "sync: false" = Render asks you for these when you create the Blueprint
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # Game reminders: every 10 minutes, ask the website to email people whose game starts within the hour.
  - type: cron
    name: sportive-circle-reminders
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "X-Task-Token: $TASK_TOKEN" "https://$APP_HOST/tasks/send-reminders"'
    envVars:
      - key: TASK_TOKEN
        fromService:
          type: web
          name: sportive-circle
          envVarKey: TASK_TOKEN
      - key: APP_HOST
        fromService:
          type: web
          name: sportive-circle
          property: host
